app-id: org.cianova.Launcher
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: "6.10"
command: cianova-launcher.sh

platform-extensions:
  - org.freedesktop.Platform.GL.default//25.08

build-options:
  strip: false
  no-debug-source: true
  build-args:
    - --share=network

finish-args:
  # Acceso a X11 y Wayland para GUI
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Config
  - --env=GTK_THEME=Adwaita-dark
  - --metadata=X-DCONF=true
  - --env=XDG_CURRENT_DESKTOP=KDE
  # Variables de entorno para forzar modo oscuro en la aplicación
  - --env=QT_QPA_PLATFORMTHEME=kde
  - --env=QT_STYLE_OVERRIDE=kvantum
  - --env=COLOR_SCHEME=dark

  # Acceso a GPU para OpenGL
  - --device=dri

  # Permitir diálogos de archivos nativos
  - --talk-name=org.freedesktop.portal.FileChooser

  # Acceso a red para descargas
  - --share=network

  # Acceso al sistema de archivos home para guardar datos
  - --filesystem=home
  # Acceso explícito a datos locales para migración (Flatpak suele ocultar .local)
  - --filesystem=~/.local/share/mcpelauncher
  # Acceso explícito a datos flatpak para migración (Flatpak Custom .var)
  - --filesystem=~/.var/app

  # Acceso a PulseAudio para sonido
  - --socket=pulseaudio

  # Permitir ejecución de binarios empaquetados
  - --talk-name=org.freedesktop.Flatpak
  # Acceso a GameMode
  - --talk-name=com.feralinteractive.GameMode

  # Acceso para leer /.flatpak-info (detección de contexto)
  - --filesystem=/.flatpak-info:ro

  # Persistir datos entre actualizaciones
  - --persist=.mcpelauncher

  # Soporte para los mandos y dispositivos a bajo nivel
  - --device=all

  # Acceso a Discord IPC para Rich Presence (opcional)
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord

  # Buses D-Bus — necesarios para Qt6 WebEngine (portals, sandbox IPC, sys bus)
  - --socket=session-bus
  - --socket=system-bus

  # Variables de entorno necesarias
  - --env=PATH=/app/bin:/usr/bin
  - --env=LD_LIBRARY_PATH=/app/lib:/app/lib/cianova:$LD_LIBRARY_PATH
  - --env=SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
  # Qt6 WebEngine QML modules provided by the base extension (io.qt.qtwebengine.BaseApp)
  # live at /app/lib/qml/ inside the sandbox. QML engine needs this path to find
  # the QtWebEngine QML plugin required by mcpelauncher-webview.
  # QML2_IMPORT_PATH (Qt5 compat) and QML_IMPORT_PATH are both set. Also include
  # the runtime's default QML path (/usr/lib/qml/) as a fallback.
  - --env=QML_IMPORT_PATH=/app/lib/qml:/usr/lib/qml
  - --env=QML2_IMPORT_PATH=/app/lib/qml:/usr/lib/qml
  # Chromium/WebEngine sandbox conflicts with Flatpak's own sandboxing (zygote
  # fails to spawn child processes). Disable the inner sandbox — Flatpak already
  # provides process isolation.
  - --env=QTWEBENGINE_CHROMIUM_FLAGS=--no-sandbox

modules:
  - name: libevdev
    buildsystem: autotools
    sources:
      - type: archive
        path: flatlibs/libevdev-1.13.1.tar.xz

  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_BZIP2=OFF
      - -DENABLE_LZMA=OFF
      - -DBUILD_DOC=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_REGRESS=OFF
      - -DBUILD_TOOLS=OFF
    sources:
      - type: archive
        path: flatlibs/libzip-1.11.3.tar.xz
    post-install:
      # Symlink para compatibilidad con binarios viejos que buscan libzip.so.4
      - ln -s libzip.so.5 /app/lib/libzip.so.4
      - ls -la /app/lib/libzip.so.5 /app/lib/libzip.so.4
  # Módulo principal del launcher con dependencias Python
  - name: cianova-launcher
    buildsystem: simple
    build-commands:
      # Crear directorio para el launcher
      - mkdir -p /app/lib/cianova
      - cp -r dist/CianovaLauncherMCPE/* /app/lib/cianova
      - install -Dm755 cianova-launcher.sh /app/bin/cianova-launcher.sh


      # Copiar binarios de mcpelauncher al directorio bin/
      - mkdir -p /app/bin
      - cp -r bin/* /app/bin/ || true
      - chmod +x /app/bin/* || true

      # Copiar librerías auxiliares (libprotobuf.so.32 para gplaydl) a /app/lib/
      - cp -r bin/lib/* /app/lib/ || true

      # qt.conf para que las apps Qt6 (mcpelauncher-webview, playdl-signin-ui-qt)
      # encuentren los módulos QML tanto del runtime KDE (/usr/lib/qml/) como
      # del base extension QtWebEngine (/app/lib/qml/).
      - |
        cat > /app/bin/qt.conf << EOF
        [Paths]
        Qml2Imports = /app/lib/qml:/usr/lib/qml
        EOF

      # Eliminar libharfbuzz empaquetado (v8) que entra en conflicto con
      # el del runtime KDE 6.10 (v11) — libharfbuzz-subset necesita hb_free
      - rm -f /app/lib/cianova/_internal/libharfbuzz.so.0

      # Pasar los lib necesarios
      - mkdir -p /app/share/mcpelauncher || true
      - cp -r libs_mc/lib /app/share/mcpelauncher/
      - cp libs_mc/gamecontrollerdb.txt /app/share/mcpelauncher/ || true

      # Copiar icono
      - install -Dm644 org.cianova.Launcher.png /app/share/icons/hicolor/256x256/apps/org.cianova.Launcher.png

      # Crear archivo .desktop
      - |
        cat > org.cianova.Launcher.desktop << EOF
        [Desktop Entry]
        Name=Cianova Launcher
        Comment=Launcher para Minecraft Bedrock en Linux
        Exec=cianova-launcher.sh
        Icon=org.cianova.Launcher
        Type=Application
        Categories=Game;Utility;
        Terminal=false
        EOF
      - install -Dm644 org.cianova.Launcher.desktop /app/share/applications/org.cianova.Launcher.desktop
      # Crear archivo de metadatos AppStream
      - |
        cat > org.cianova.Launcher.metainfo.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <component type="desktop-application">
          <id>org.cianova.Launcher</id>
          <name>Cianova Launcher</name>
          <summary>Launcher para Minecraft Bedrock Edition en Linux</summary>
          <metadata_license>CC0-1.0</metadata_license>
          <project_license>GPL-3.0-or-later</project_license>
          <description>
            <p>
              CianovaLauncher es un lanzador gráfico para Minecraft Bedrock Edition en Linux,
              basado en mcpelauncher. Permite gestionar versiones, instalar APKs, y configurar
              el entorno de juego de manera sencilla.
            </p>
          </description>
          <launchable type="desktop-id">org.cianova.Launcher.desktop</launchable>
          <provides>
            <binary>cianova-launcher.sh</binary>
          </provides>
        </component>
        EOF
      - install -Dm644 org.cianova.Launcher.metainfo.xml /app/share/metainfo/org.cianova.Launcher.metainfo.xml

    sources:
      - type: dir
        path: .
