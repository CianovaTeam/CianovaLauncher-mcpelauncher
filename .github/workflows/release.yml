# Release workflow for Cianova Launcher
#
# When a tag v* is pushed (or triggered manually), this workflow:
#   1. Builds the Python app with PyInstaller
#   2. Downloads pre-compiled mcpelauncher binaries from mcpelauncher-bins repo
#   3. Builds the Flatpak package
#   4. Generates the offline .flatpak bundle
#   5. Packages the portable .tar.gz
#   6. Builds the signed x86_64 AppImage
#   7. Creates a GitHub Release with all assets
#   8. Deploys the Flatpak repo to gh-pages
#
# Jobs run in parallel after PyInstaller:
#   - release: Flatpak bundle, portable tar.gz, release, gh-pages deploy
#   - appimage: AppImage creation (runs after release to upload to existing tag)
#
# ── Prerequisites ──
#   - GPG_PRIVATE_KEY secret: the private GPG key for signing the Flatpak repo
#   - GPG_KEY_ID secret: the key ID (e.g. 3B72E50788CA732336B40855E4220487186BAA61)
#   - mcpelauncher-bins repo with compiled binaries as GitHub Releases
#
# ── How to trigger ──
#   git tag v3.1.0
#   git push origin v3.1.0

name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v3.1.0)"
        required: true
        default: "v3.1.0"
      mcpelauncher_bins_version:
        description: "mcpelauncher-bins version to use (leave empty for latest)"
        required: false
      is_hotfix:
        description: "¿Es un hotfix? (re-publicación de la misma versión para un fix urgente)"
        required: false
        type: boolean
        default: false
      hotfix_reason:
        description: "Razón del hotfix (se mostrará en el aviso a los usuarios)"
        required: false
        type: string
      hotfix_force:
        description: "Aviso obligatorio (no se puede ignorar por el usuario)"
        required: false
        type: boolean
        default: false

  # ── Uncomment when ready for automatic release on tag push ──
  # push:
  #   tags:
  #     - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── System dependencies ──
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder python3-pip python3-venv \
            libfuse2 patchelf
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # ── Python ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install PySide6 Pillow pyinstaller

      # ── Build Python app ──
      - name: Build with PyInstaller
        run: |
          source venv/bin/activate
          ./build.sh

      # ── Resolve mcpelauncher-bins version ──
      - name: Resolve mcpelauncher-bins version
        id: bins
        run: |
          TAG="${{ github.event.inputs.mcpelauncher_bins_version }}"
          if [ -z "$TAG" ]; then
            echo "Fetching latest release from PlaGaPlusDev/mcpelauncher-bins..."
            TAG=$(curl -sL https://api.github.com/repos/PlaGaPlusDev/mcpelauncher-bins/releases/latest \
              | jq -r '.tag_name')
            echo "Latest: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ── Download mcpelauncher binaries ──
      - name: Download mcpelauncher binaries
        run: |
          TAG="${{ steps.bins.outputs.tag }}"
          URL="https://github.com/PlaGaPlusDev/mcpelauncher-bins/releases/download/$TAG/mcpelauncher_bins-$TAG.tar.gz"
          echo "Downloading from: $URL"
          curl -fL -o mcpelauncher_bins.tar.gz "$URL"
          tar -xzf mcpelauncher_bins.tar.gz
          rm -rf bin libs_mc
          mv mcpelauncher_bins-*/bin ./bin
          mv mcpelauncher_bins-*/libs_mc ./libs_mc
          rm -rf mcpelauncher_bins-* mcpelauncher_bins.tar.gz

      # ── Flatpak ──
      # ── Prepare launcher build for Flatpak ──
      - name: Prepare launcher build for Flatpak
        run: |
          if [ -d "dist/CianovaLauncherMCPE" ]; then
            mkdir -p launcher-build
            cp -r dist/CianovaLauncherMCPE/* launcher-build/
          fi

      - name: Import GPG key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            echo "trust-model always" >> ~/.gnupg/gpg.conf
            gpgconf --kill gpg-agent || true
            echo "$GPG_KEY" | gpg --import --no-tty --batch --pinentry-mode loopback
            GPG_PASSPHRASE="${{ secrets.GPG_KEY_PASSPHRASE }}"
            if [ -n "$GPG_PASSPHRASE" ] && [ -n "$GPG_KEY_ID" ]; then
              echo "Caching GPG passphrase in agent..."
              echo "dummy" | gpg --no-tty --batch --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEY_ID" --detach-sign > /dev/null 2>&1
            fi
            echo "GPG key imported successfully"
          else
            echo "No GPG_PRIVATE_KEY secret set — skipping GPG import"
          fi

      - name: Install Flatpak runtimes
        run: |
          flatpak install --user -y flathub org.kde.Platform//6.10 || true
          flatpak install --user -y flathub org.kde.Sdk//6.10 || true
          flatpak install --user -y flathub io.qt.qtwebengine.BaseApp//6.10 || true

      - name: Build Flatpak
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          SIGN=""
          if [ -n "$GPG_KEY_ID" ]; then
            SIGN="--gpg-sign=$GPG_KEY_ID"
          fi
          flatpak-builder --user --force-clean \
            --repo=repo_dist \
            $SIGN \
            build-dir org.cianova.Launcher.yml

      - name: Validate Flatpak has mcpelauncher binaries
        run: |
          echo "Checking binaries in flatpak build..."
          test -f build-dir/files/bin/mcpelauncher-client || { echo "ERROR: mcpelauncher-client not found in flatpak build"; exit 1; }
          echo "  mcpelauncher-client: OK"
          test -f build-dir/files/bin/mcpelauncher-extract || { echo "ERROR: mcpelauncher-extract not found in flatpak build"; exit 1; }
          echo "  mcpelauncher-extract: OK"
          test -f build-dir/files/bin/mcpelauncher-webview || { echo "ERROR: mcpelauncher-webview not found in flatpak build"; exit 1; }
          echo "  mcpelauncher-webview: OK"
          echo "All binaries present in flatpak build."

      - name: Update Flatpak repo
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          SIGN=""
          if [ -n "$GPG_KEY_ID" ]; then
            SIGN="--gpg-sign=$GPG_KEY_ID"
          fi
          flatpak build-update-repo --prune --prune-depth=5 \
            --generate-static-deltas \
            $SIGN \
            repo_dist

      - name: Generate Flatpak bundle
        run: |
          flatpak build-bundle repo_dist \
            CianovaLauncher-${{ env.VERSION }}.flatpak \
            org.cianova.Launcher \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      # ── Portable tar.gz ──
      - name: Package portable build
        run: |
          if [ -d "dist/CianovaLauncherMCPE" ]; then
            DIR="CianovaLauncher-${{ env.VERSION }}"
            mv dist/CianovaLauncherMCPE "$DIR"
            cp -r bin "$DIR/bin"
            mkdir -p "$DIR/lib"
            cp -r libs_mc/lib "$DIR/lib/"
            cp libs_mc/gamecontrollerdb.txt "$DIR/lib/"
            cp assets/CianovaLauncher.sh "$DIR/CianovaLauncher.sh" 2>/dev/null || true
            tar -czf "$DIR.tar.gz" "$DIR"
            rm -rf "$DIR"
          fi

      # ── GitHub Release ──
      - name: Extract changelog section
        run: |
          CHANGELOG_VERSION="${{ env.VERSION }}"
          CHANGELOG_SECTION="${CHANGELOG_VERSION#v}"
          CHANGELOG_SECTION="${CHANGELOG_SECTION%.*}"
          awk -v ver="[$CHANGELOG_SECTION]" \
            '/^# \[/ {if (found) exit; if (index($0, "# " ver) == 1) found=1}
             found {print}' Docs/Changelog.md > Docs/Changelog-current.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Cianova Launcher ${{ env.VERSION }}
          body_path: Docs/Changelog-current.md
          fail_on_unmatched_files: false
          overwrite: true
          draft: true
          files: |
            CianovaLauncher-${{ env.VERSION }}.flatpak
            CianovaLauncher-${{ env.VERSION }}.tar.gz
            assets/flatpak/CianovaLauncher.flatpakrepo

      # ── Update version.json on gh-pages root ──
      # Uses the Contents API (no full clone of the 500MB flatpak repo).
      # Hotfix fields let the launcher notify users even when the version string
      # is unchanged (same-version re-release).
      - name: Update version.json on gh-pages
        uses: actions/github-script@v7
        env:
          VERSION: ${{ env.VERSION }}
          IS_HOTFIX: ${{ github.event.inputs.is_hotfix || 'false' }}
          HOTFIX_REASON: ${{ github.event.inputs.hotfix_reason }}
          HOTFIX_FORCE: ${{ github.event.inputs.hotfix_force || 'false' }}
        with:
          script: |
            const version = process.env.VERSION.replace(/^v/, '');
            const isHotfix = process.env.IS_HOTFIX === 'true';
            const reason = (process.env.HOTFIX_REASON || '').trim();
            const force = process.env.HOTFIX_FORCE === 'true';

            if (isHotfix && !reason) {
              core.setFailed('hotfix_reason es obligatorio cuando is_hotfix=true');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'version.json';
            const branch = 'gh-pages';

            let existing = { latest_version: '', prerelease: false };
            let sha;
            try {
              const res = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              sha = res.data.sha;
              existing = JSON.parse(Buffer.from(res.data.content, 'base64').toString('utf-8'));
            } catch (e) {
              core.info('version.json no encontrado en gh-pages, se creará.');
            }

            const newData = {
              latest_version: version,
              prerelease: false,
            };

            if (isHotfix) {
              const crypto = require('crypto');
              const id = 'hf-' + crypto.createHash('sha1')
                .update(version + '|' + reason).digest('hex').slice(0, 12);
              newData.hotfix = {
                id: id,
                title: reason.slice(0, 80),
                body: reason,
                force: force,
              };
            } else {
              delete existing.hotfix;
            }

            const content = Buffer.from(JSON.stringify(newData, null, 2) + '\n').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `Update version.json to ${version}${isHotfix ? ' (hotfix)' : ''}`,
              content,
              branch,
              sha,
            });
            core.info(`version.json actualizado en gh-pages (hotfix: ${isHotfix})`);

      # ── Deploy Flatpak repo to gh-pages ──
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./repo_dist
          destination_dir: ./repo_dist
          keep_files: true

  appimage:
    runs-on: ubuntu-24.04
    needs: release
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            patchelf desktop-file-utils \
            python3-pip python3-venv \
            libfuse2 \
            libcurl4t64 libssl3t64 \
            libx11-6 libxext6 libxi6 libxrandr2 libxcursor1 libxfixes3 libxrender1 \
            libasound2t64 libpulse0 libsystemd0 \
            libgl1 libegl1 libgles2 \
            libgl1-mesa-dri mesa-vulkan-drivers \
            libudev1 libevdev2 \
            libpng16-16t64 zlib1g \
            libdbus-1-3 \
            libxkbcommon0 libfontconfig1 libfreetype6 \
            libgbm1 libdrm2 \
            libzip4t64 libprotobuf32t64 \
            libqt6core6t64 libqt6gui6t64 libqt6widgets6t64 libqt6network6t64 \
            libqt6webenginecore6 libqt6webenginewidgets6 \
            libqt6qml6 libqt6webchannel6 \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            zenity unzip \
            qt6-base-dev-tools

      - name: Setup AppImage tooling
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install PySide6 Pillow pyinstaller

      - name: Build with PyInstaller
        run: |
          source venv/bin/activate
          ./build.sh

      - name: Resolve mcpelauncher-bins version
        id: bins
        run: |
          TAG="${{ github.event.inputs.mcpelauncher_bins_version }}"
          if [ -z "$TAG" ]; then
            echo "Fetching latest release from PlaGaPlusDev/mcpelauncher-bins..."
            TAG=$(curl -sL https://api.github.com/repos/PlaGaPlusDev/mcpelauncher-bins/releases/latest \
              | jq -r '.tag_name')
            echo "Latest: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download mcpelauncher binaries
        run: |
          TAG="${{ steps.bins.outputs.tag }}"
          URL="https://github.com/PlaGaPlusDev/mcpelauncher-bins/releases/download/$TAG/mcpelauncher_bins-$TAG.tar.gz"
          echo "Downloading from: $URL"
          curl -fL -o mcpelauncher_bins.tar.gz "$URL"
          tar -xzf mcpelauncher_bins.tar.gz
          rm -rf bin libs_mc
          mv mcpelauncher_bins-*/bin ./bin
          mv mcpelauncher_bins-*/libs_mc ./libs_mc
          rm -rf mcpelauncher_bins-* mcpelauncher_bins.tar.gz

      - name: Import GPG key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            echo "trust-model always" >> ~/.gnupg/gpg.conf
            gpgconf --kill gpg-agent || true
            echo "$GPG_KEY" | gpg --import --no-tty --batch --pinentry-mode loopback
            GPG_PASSPHRASE="${{ secrets.GPG_KEY_PASSPHRASE }}"
            if [ -n "$GPG_PASSPHRASE" ] && [ -n "$GPG_KEY_ID" ]; then
              echo "Caching GPG passphrase in agent..."
              echo "dummy" | gpg --no-tty --batch --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEY_ID" --detach-sign > /dev/null 2>&1
            fi
            echo "GPG key imported successfully"
          else
            echo "No GPG_PRIVATE_KEY secret set — skipping GPG import"
          fi

      - name: Create AppDir
        run: |
          APPDIR="CianovaLauncher.AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/lib/cianova"
          mkdir -p "${APPDIR}/usr/share/mcpelauncher/lib"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"

          cp -r dist/CianovaLauncherMCPE/* "${APPDIR}/usr/lib/cianova/"

          cp bin/* "${APPDIR}/usr/bin/"
          chmod +x "${APPDIR}/usr/bin/"*

          cp -r libs_mc/lib/* "${APPDIR}/usr/share/mcpelauncher/lib/"
          cp libs_mc/gamecontrollerdb.txt "${APPDIR}/usr/share/mcpelauncher/"

          cp org.cianova.Launcher.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/cianova-launcher.png"
          cp org.cianova.Launcher.png "${APPDIR}/cianova-launcher.png"

          cat > "${APPDIR}/cianova-launcher.desktop" << 'DEOF'
          [Desktop Entry]
          Name=Cianova Launcher
          Comment=Launcher para Minecraft Bedrock en Linux
          Exec=AppRun
          Icon=cianova-launcher
          Type=Application
          Categories=Game;Utility;
          Terminal=false
          DEOF

          cp "${APPDIR}/cianova-launcher.desktop" "${APPDIR}/usr/share/applications/"

          cat > "${APPDIR}/AppRun" << 'ARUN'
          #!/bin/bash
          SELF_DIR="$(dirname "$(readlink -f "$0")")"
          export PATH="${SELF_DIR}/usr/bin:$PATH"
          export LD_LIBRARY_PATH="${SELF_DIR}/usr/lib:${SELF_DIR}/usr/lib/cianova/_internal:${LD_LIBRARY_PATH}"
          export MCPELAUNCHER_DATA_DIR="${SELF_DIR}/usr/share/mcpelauncher"
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          export QT_QPA_PLATFORM_PLUGIN_PATH="${SELF_DIR}/usr/lib/qt6/plugins:${SELF_DIR}/usr/plugins"
          export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --ignore-gpu-blocklist"
          export QT_QUICK_BACKEND="software"
          DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/mcpelauncher"
          mkdir -p "$DATA_DIR"
          exec "${SELF_DIR}/usr/lib/cianova/CianovaLauncherMCPE" "$@"
          ARUN
          chmod +x "${APPDIR}/AppRun"

          rm -f "${APPDIR}/usr/lib/cianova/_internal/libharfbuzz.so.0"
          rm -f "${APPDIR}/usr/lib/cianova/_internal/libssl.so.3"
          rm -f "${APPDIR}/usr/lib/cianova/_internal/libcrypto.so.3"

      - name: Bundle dependencies with linuxdeploy
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD:$PATH"
          export QMAKE="$(which qmake6 2>/dev/null || which qmake 2>/dev/null || echo '')"
          ./linuxdeploy-x86_64.AppImage \
            --appdir CianovaLauncher.AppDir \
            --plugin qt

      - name: Build final signed AppImage
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          SIGN=""
          if [ -n "$GPG_KEY_ID" ]; then
            SIGN="--sign-key=$GPG_KEY_ID"
          fi
          /tmp/appimagetool --no-appstream-check $SIGN \
            CianovaLauncher.AppDir \
            "CianovaLauncher-${VERSION}-x86_64.AppImage"

      - name: Upload AppImage to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: CianovaLauncher-${{ env.VERSION }}-x86_64.AppImage
          fail_on_unmatched_files: false
          overwrite: true
